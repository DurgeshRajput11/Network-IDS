services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  fastapi:
      image: python:3.11-slim
      working_dir: /app
      volumes:
        - ../:/app
        - uv_cache:/root/.cache/uv  # Added cache mount
      command: >
        sh -c "
        apt-get update &&
        apt-get install -y curl &&
        pip install --no-cache-dir uv &&
        UV_PROJECT_ENVIRONMENT=/opt/venv uv sync --project /app &&
        /opt/venv/bin/python -m uvicorn src.inference.app.main:app --host 0.0.0.0 --port 8000
        "
      environment:
        UV_CACHE_DIR: /root/.cache/uv  # Tell uv to use the volume
        MODEL_ARTIFACT_DIR: /app/artifacts
        CELERY_BROKER_URL: redis://redis:6379/0
        CELERY_RESULT_BACKEND: redis://redis:6379/0
        REDIS_HOST: redis
      ports:
        - "8000:8000"
      depends_on:
        - kafka
        - redis
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 300s
      restart: on-failure

  celery-worker:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ../:/app
      - uv_cache:/root/.cache/uv  # Added cache mount
    command:
      - sh
      - -c
      - ' apt-get update && apt-get install -y curl && pip install --no-cache-dir uv && UV_PROJECT_ENVIRONMENT=/opt/venv uv sync --project /app && /opt/venv/bin/python -m celery -A src.mlops.celery_worker worker --loglevel=info '
    environment:
      UV_CACHE_DIR: /root/.cache/uv  # Tell uv to use the volume
      MODEL_ARTIFACT_DIR: /app/artifacts
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_HOST: redis
    depends_on:
      - redis
    restart: on-failure 

  orchestrator:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ../:/app
    command: >
      sh -c "pip install --no-cache-dir requests &&
             python src/mlops/orchestrator.py"
    depends_on:
      fastapi:
        condition: service_healthy
    restart: on-failure

  mlflow:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ../artifacts:/app/artifacts
      - ../mlruns:/app/mlruns
    command: >
      sh -c "
      pip install --no-cache-dir mlflow boto3 &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri file:///app/mlruns
      --default-artifact-root file:///app/artifacts
      "
    ports:
      - "5000:5000"

volumes:
  uv_cache: